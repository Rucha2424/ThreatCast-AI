services:

  neo4j:
    image: neo4j:5.26-community
    container_name: threatcast-neo4j
    environment:
      NEO4J_AUTH: neo4j/threatcast_demo_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - threatcast_neo4j_data:/data
      - threatcast_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p threatcast_demo_password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: threatcast-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: threatcast_demo_password
      NEO4J_DATABASE: neo4j
    command:
      - /bin/sh
      - -c
      - |
        python -m backend.database.import_ctu13
        python -m backend.database.import_predictions
        python -m backend.database.store_warning_events

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: threatcast-backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production
      CORS_ALLOWED_ORIGINS: "http://localhost:8501,http://localhost:5173,http://localhost:3000"
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "threatcast_demo_password"
      NEO4J_DATABASE: "neo4j"
      FABRIC_ENABLED: "false"
      FABRIC_WORKSPACE_ROOT: "/app/blockchain"
      FABRIC_LOCAL_LEDGER_PATH: "/app/backend/data/blockchain/disagreements.json"
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - threatcast_blockchain_ledger:/app/backend/data/blockchain
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatcast-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  threatcast_neo4j_data:
  threatcast_neo4j_logs:
  threatcast_blockchain_ledger:
